<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title desc">
  <title id="title">India's UPI Payment Rail in Numbers</title>
  <desc id="desc">Light editorial cover with India map and UPI payment scale statistics.</desc>

  <rect width="1200" height="675" fill="#ffffff"/>

  <!-- Left editorial copy -->
  <rect x="56" y="48" width="128" height="32" rx="6" fill="#f45b16"/>
  <text x="72" y="69" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="700" letter-spacing="2.2">DATA STORY</text>

  <text x="56" y="128" fill="#102a43" font-family="Georgia, 'Times New Roman', serif" font-size="46" font-weight="700">India's UPI Rail</text>
  <text x="56" y="178" fill="#f45b16" font-family="Georgia, 'Times New Roman', serif" font-size="40" font-weight="700">in Real Numbers</text>

  <text x="58" y="228" fill="#5f6368" font-family="Arial, Helvetica, sans-serif" font-size="20">
    <tspan x="58" dy="0">How fast did UPI become India's default</tspan>
    <tspan x="58" dy="28">payment layer—and what does NPCI data show?</tspan>
  </text>

  <!-- Right map panel (Hormuz-style) -->
  <rect x="612" y="44" width="532" height="300" rx="18" fill="#f4f7fb" stroke="#e5e1d8" stroke-width="1.5"/>

  <!-- Arabian sea / background water tone -->
  <path d="M640 300 C700 260 820 250 920 280 C1000 305 1040 290 1088 310 L1088 330 L640 330 Z" fill="#e8f0f8"/>

  <!-- Simplified India landmass -->
  <path d="M760 92 C830 78 910 88 952 128 C990 168 980 218 948 258 C916 298 860 318 808 308 C756 298 718 268 702 228 C686 188 700 118 760 92 Z" fill="#f8f7f2" stroke="#d7dee7" stroke-width="2"/>
  <text x="818" y="205" text-anchor="middle" fill="#102a43" font-family="Arial, sans-serif" font-size="22" font-weight="700">INDIA</text>

  <!-- UPI hub highlight -->
  <circle cx="818" cy="178" r="34" fill="#fff7ed" stroke="#f45b16" stroke-width="3" stroke-dasharray="6 5"/>
  <text x="818" y="174" text-anchor="middle" fill="#f45b16" font-family="Arial, sans-serif" font-size="14" font-weight="800">UPI</text>
  <text x="818" y="192" text-anchor="middle" fill="#5f6368" font-family="Arial, sans-serif" font-size="10" font-weight="600">NPCI</text>

  <!-- City nodes -->
  <circle cx="770" cy="148" r="7" fill="#ffffff" stroke="#102a43" stroke-width="2"/>
  <circle cx="878" cy="138" r="7" fill="#ffffff" stroke="#102a43" stroke-width="2"/>
  <circle cx="900" cy="228" r="7" fill="#ffffff" stroke="#102a43" stroke-width="2"/>
  <circle cx="748" cy="248" r="7" fill="#ffffff" stroke="#102a43" stroke-width="2"/>
  <text x="770" y="132" text-anchor="middle" fill="#5f6368" font-size="10" font-weight="600">Delhi</text>
  <text x="878" y="122" text-anchor="middle" fill="#5f6368" font-size="10" font-weight="600">Kolkata</text>
  <text x="900" y="252" text-anchor="middle" fill="#5f6368" font-size="10" font-weight="600">Chennai</text>
  <text x="748" y="268" text-anchor="middle" fill="#5f6368" font-size="10" font-weight="600">Mumbai</text>

  <!-- P2P flows (orange) -->
  <path d="M770 155 C792 162 808 168 818 172" fill="none" stroke="#f45b16" stroke-width="7" stroke-linecap="round"/>
  <path d="M878 145 C858 158 838 166 818 172" fill="none" stroke="#f45b16" stroke-width="7" stroke-linecap="round"/>
  <path d="M748 241 C768 218 792 194 818 178" fill="none" stroke="#f45b16" stroke-width="7" stroke-linecap="round"/>
  <text x="688" y="196" fill="#f45b16" font-family="Arial, sans-serif" font-size="13" font-weight="700">P2P</text>

  <!-- P2M flows (blue) -->
  <path d="M818 212 C838 228 862 238 900 228" fill="none" stroke="#2563eb" stroke-width="7" stroke-linecap="round"/>
  <path d="M818 198 C840 188 860 182 878 138" fill="none" stroke="#2563eb" stroke-width="6" stroke-linecap="round" opacity="0.85"/>
  <text x="930" y="210" fill="#2563eb" font-family="Arial, sans-serif" font-size="13" font-weight="700">P2M</text>

  <!-- Growth arc label -->
  <text x="640" y="318" fill="#5f6368" font-family="Arial, sans-serif" font-size="12" font-weight="600">Digital payment volume scaling across India, FY 2022-23 to FY 2025-26</text>

  <!-- Stat cards -->
  <rect x="56" y="380" width="340" height="250" rx="16" fill="#ffffff" stroke="#e5e1d8" stroke-width="2"/>
  <circle cx="104" cy="430" r="22" fill="#fff7ed" stroke="#f45b16" stroke-width="2"/>
  <text x="104" y="436" text-anchor="middle" fill="#f45b16" font-family="Arial, sans-serif" font-size="16" font-weight="800">#</text>
  <text x="142" y="428" fill="#102a43" font-family="Arial, sans-serif" font-size="38" font-weight="800">241.6 Bn</text>
  <text x="142" y="462" fill="#5f6368" font-family="Arial, sans-serif" font-size="16">Transactions in FY 2025-26</text>

  <rect x="420" y="380" width="340" height="250" rx="16" fill="#ffffff" stroke="#e5e1d8" stroke-width="2"/>
  <circle cx="468" cy="430" r="22" fill="#eff6ff" stroke="#2563eb" stroke-width="2"/>
  <text x="468" y="436" text-anchor="middle" fill="#2563eb" font-family="Arial, sans-serif" font-size="15" font-weight="800">₹</text>
  <text x="506" y="428" fill="#102a43" font-family="Arial, sans-serif" font-size="38" font-weight="800">₹314 L Cr</text>
  <text x="506" y="462" fill="#5f6368" font-family="Arial, sans-serif" font-size="16">Value moved in FY 2025-26</text>

  <rect x="784" y="380" width="360" height="250" rx="16" fill="#ffffff" stroke="#e5e1d8" stroke-width="2"/>
  <circle cx="832" cy="430" r="22" fill="#fff7ed" stroke="#d97706" stroke-width="2"/>
  <text x="832" y="436" text-anchor="middle" fill="#d97706" font-family="Arial, sans-serif" font-size="13" font-weight="800">%</text>
  <text x="870" y="428" fill="#102a43" font-family="Arial, sans-serif" font-size="38" font-weight="800">93.4%</text>
  <text x="870" y="462" fill="#5f6368" font-family="Arial, sans-serif" font-size="16">NPCI retail volume share (Q1 FY26)</text>

  <text x="56" y="658" fill="#94a3b8" font-family="Arial, sans-serif" font-size="12">Source: NPCI Retail Payments Statistics · rkjat.in</text>
</svg>