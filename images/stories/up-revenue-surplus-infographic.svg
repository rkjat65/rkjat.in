<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 920" role="img" aria-labelledby="title desc">
  <title id="title">How U.P.'s revenue surplus is made — and unmade</title>
  <desc id="desc">Infographic: budgeted vs actual receipts and spending create a ₹59,327 crore surplus; full budgeted spend would flip it to a deficit.</desc>

  <rect width="1200" height="920" fill="#ffffff"/>
  <rect x="32" y="32" width="1136" height="856" rx="20" fill="#faf9f6" stroke="#e5e1d8"/>

  <!-- header -->
  <text x="64" y="78" fill="#f45b16" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700" letter-spacing="3.2">INFOGRAPHIC · UTTAR PRADESH · FY 2024-25</text>
  <text x="64" y="124" fill="#102a43" font-family="Georgia, 'Times New Roman', serif" font-size="34" font-weight="700">How the &#8220;revenue surplus&#8221; is made</text>
  <text x="64" y="158" fill="#64748b" font-family="Arial, Helvetica, sans-serif" font-size="16">A three-step reading of the budget arithmetic behind &#8377;59,327 crore</text>

  <!-- ========== STEP CARDS ========== -->
  <!-- Step 1 -->
  <rect x="64" y="190" width="340" height="280" rx="16" fill="#ffffff" stroke="#e5e1d8"/>
  <circle cx="100" cy="228" r="18" fill="#102a43"/>
  <text x="100" y="234" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">1</text>
  <text x="130" y="234" fill="#102a43" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">THE BUDGET PROMISE</text>
  <text x="88" y="272" fill="#64748b" font-family="Arial, Helvetica, sans-serif" font-size="13">U.P. planned a large revenue</text>
  <text x="88" y="292" fill="#64748b" font-family="Arial, Helvetica, sans-serif" font-size="13">machine on paper:</text>

  <rect x="88" y="316" width="292" height="56" rx="10" fill="#f1f5f9"/>
  <text x="104" y="340" fill="#64748b" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="600">BUDGETED RECEIPTS</text>
  <text x="104" y="360" fill="#102a43" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-weight="700">&#8377;6,06,802 Cr</text>

  <rect x="88" y="384" width="292" height="56" rx="10" fill="#f1f5f9"/>
  <text x="104" y="408" fill="#64748b" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="600">BUDGETED REVEX</text>
  <text x="104" y="428" fill="#102a43" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-weight="700">&#8377;5,32,655 Cr</text>

  <!-- arrow between 1 and 2 -->
  <path d="M418 330 L448 330" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
  <path d="M440 320 L456 330 L440 340" fill="#cbd5e1"/>

  <!-- Step 2 -->
  <rect x="468" y="190" width="340" height="280" rx="16" fill="#ffffff" stroke="#e5e1d8"/>
  <circle cx="504" cy="228" r="18" fill="#f45b16"/>
  <text x="504" y="234" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">2</text>
  <text x="534" y="234" fill="#102a43" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">WHAT ACTUALLY HAPPENED</text>
  <text x="492" y="272" fill="#64748b" font-family="Arial, Helvetica, sans-serif" font-size="13">Receipts missed the plan &#8212; and</text>
  <text x="492" y="292" fill="#64748b" font-family="Arial, Helvetica, sans-serif" font-size="13">spending missed it by more:</text>

  <rect x="492" y="316" width="292" height="56" rx="10" fill="#fef3c7"/>
  <text x="508" y="340" fill="#92400e" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="600">ACTUAL RECEIPTS  ·  ~16% SHORT</text>
  <text x="508" y="360" fill="#102a43" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-weight="700">&#8377;5,10,213 Cr</text>

  <rect x="492" y="384" width="292" height="56" rx="10" fill="#fee2e2"/>
  <text x="508" y="408" fill="#991b1b" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="600">ACTUAL REVEX  ·  &#8722;15.4% UNDERSPEND</text>
  <text x="508" y="428" fill="#102a43" font-family="Georgia, 'Times New Roman', serif" font-size="18" font-weight="700">&#8377;4,50,886 Cr</text>

  <!-- arrow between 2 and 3 -->
  <path d="M822 330 L852 330" stroke="#cbd5e1" stroke-width="3" stroke-linecap="round"/>
  <path d="M844 320 L860 330 L844 340" fill="#cbd5e1"/>

  <!-- Step 3 -->
  <rect x="872" y="190" width="264" height="280" rx="16" fill="#102a43"/>
  <circle cx="908" cy="228" r="18" fill="#f45b16"/>
  <text x="908" y="234" text-anchor="middle" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">3</text>
  <text x="938" y="234" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">THE HEADLINE</text>
  <text x="896" y="280" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="13">Actual receipts</text>
  <text x="896" y="300" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="13">minus actual revex</text>
  <text x="896" y="340" fill="#f45b16" font-family="Arial, Helvetica, sans-serif" font-size="12" font-weight="700" letter-spacing="1">REVENUE SURPLUS</text>
  <text x="896" y="388" fill="#ffffff" font-family="Georgia, 'Times New Roman', serif" font-size="32" font-weight="700">&#8377;59,327</text>
  <text x="896" y="418" fill="#94a3b8" font-family="Arial, Helvetica, sans-serif" font-size="16">crore</text>
  <text x="896" y="448" fill="#64748b" font-family="Arial, Helvetica, sans-serif" font-size="12">~half of all 13 surplus</text>
  <text x="896" y="466" fill="#64748b" font-family="Arial, Helvetica, sans-serif" font-size="12">states combined</text>

  <!-- ========== VISUAL SCALE: underspend ========== -->
  <text x="64" y="520" fill="#102a43" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">Where the money did not go</text>
  <text x="64" y="544" fill="#64748b" font-family="Arial, Helvetica, sans-serif" font-size="13">Percent short of budgeted expenditure · deeper red = larger gap</text>

  <!-- revex bar track -->
  <text x="64" y="586" fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600">Revenue expenditure</text>
  <rect x="280" y="568" width="720" height="28" rx="8" fill="#e2e8f0"/>
  <rect x="280" y="568" width="610" height="28" rx="8" fill="#fbbf24"/>
  <text x="1020" y="588" fill="#dc2626" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">&#8722;15.4%</text>

  <!-- capex bar track -->
  <text x="64" y="638" fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600">Capital expenditure</text>
  <rect x="280" y="620" width="720" height="28" rx="8" fill="#e2e8f0"/>
  <rect x="280" y="620" width="526" height="28" rx="8" fill="#f87171"/>
  <text x="1020" y="640" fill="#dc2626" font-family="Arial, Helvetica, sans-serif" font-size="14" font-weight="700">&#8722;27%</text>

  <!-- ========== FLIP PANEL ========== -->
  <rect x="64" y="680" width="1072" height="172" rx="16" fill="#ffffff" stroke="#e5e1d8"/>
  <text x="88" y="718" fill="#102a43" font-family="Arial, Helvetica, sans-serif" font-size="15" font-weight="700">Flip the spend rate &#8212; and the surplus largely disappears</text>
  <text x="88" y="742" fill="#64748b" font-family="Arial, Helvetica, sans-serif" font-size="13">Same state, same year: only the utilisation assumption changes</text>

  <!-- mini outcome pills -->
  <rect x="88" y="768" width="240" height="56" rx="10" fill="#dbeafe"/>
  <text x="108" y="792" fill="#1e40af" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="600">ACTUAL (&#8722;15.35%)</text>
  <text x="108" y="812" fill="#102a43" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="700">+&#8377;59,327 Cr</text>

  <rect x="348" y="768" width="240" height="56" rx="10" fill="#fee2e2"/>
  <text x="368" y="792" fill="#991b1b" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="600">IF SPENT AS BUDGETED</text>
  <text x="368" y="812" fill="#102a43" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="700">&#8722;&#8377;22,442 Cr</text>

  <rect x="608" y="768" width="240" height="56" rx="10" fill="#fee2e2"/>
  <text x="628" y="792" fill="#991b1b" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="600">IF SPENT LIKE MAHARASHTRA</text>
  <text x="628" y="812" fill="#102a43" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="700">&#8722;&#8377;14,612 Cr</text>

  <rect x="868" y="768" width="244" height="56" rx="10" fill="#dbeafe"/>
  <text x="888" y="792" fill="#1e40af" font-family="Arial, Helvetica, sans-serif" font-size="11" font-weight="600">IF ALL-STATES AVG (&#8722;6%)</text>
  <text x="888" y="812" fill="#102a43" font-family="Georgia, 'Times New Roman', serif" font-size="16" font-weight="700">+&#8377;9,996 Cr</text>
</svg>
